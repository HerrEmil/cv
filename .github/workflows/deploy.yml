name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1

    steps:
      - uses: actions/checkout@v4

      # If your project has a build step, add it here, e.g.:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      # - run: npm ci && npm run build

      # Three passes so each asset class gets the right Cache-Control. Each keeps
      # --delete, but scoped to a disjoint set of keys (headshots / non-HTML /
      # HTML) so every file is reconciled by exactly one pass and there are no
      # cross-pass delete races.

      # Content-hashed headshots (avif/webp/jpg, {8}-hex in the filename): the
      # name changes whenever the image changes, so cache them forever; --delete
      # purges the previous hash. Fonts are NOT hashed → they ride the next pass.
      - name: Sync immutable hashed assets to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude "*" \
            --include "headshot-540.*" \
            --cache-control "public,max-age=31536000,immutable"

      # Everything else (unhashed fonts, og-card, sitemap, misc): stable names,
      # moderate 1-day TTL; the CloudFront /* invalidation flushes the edge each
      # deploy. Content-hashing the fonts would let them go immutable too
      # (cwv-lab-log backlog #1).
      - name: Sync assets to S3 (1-day cache)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.html" \
            --exclude "headshot-540.*" \
            --cache-control "public,max-age=86400"

      # HTML last: always revalidate so a fresh deploy is picked up immediately.
      - name: Sync HTML to S3 (must-revalidate)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
